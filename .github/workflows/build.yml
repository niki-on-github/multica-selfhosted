name: Build

on:
  push:
    branches: [main]
    paths:
      - upstream.env
      - patch.sh
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag to build (default: upstream.env)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: multica-backend
            file: Dockerfile
          - image: multica-web
            file: Dockerfile.web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          source upstream.env
          v="${{ inputs.version }}"
          echo "version=${v:-$MULTICA_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: multica-ai/multica
          ref: ${{ steps.version.outputs.version }}
          path: upstream

      - name: Patch
        run: ./patch.sh upstream

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: upstream
          file: upstream/${{ matrix.file }}
          pull: true
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=Multica ${{ steps.version.outputs.version }} with generic OAuth login (patch.sh)
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: |
          echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
